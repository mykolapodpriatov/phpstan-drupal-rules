name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / phpstan ${{ matrix.phpstan }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        phpstan: ['^1.11', '^2.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin PHPStan major
        run: composer require --no-update --dev "phpstan/phpstan:${{ matrix.phpstan }}"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: Dogfood PHPStan on this codebase
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress --error-format=github
